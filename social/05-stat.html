<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#F8F8F8;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.mark{width:210px;height:auto;display:block}
.body{margin-top:auto}
.eyebrow{color:#999;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
.stat{color:#16335D;font-weight:900;font-size:220px;line-height:1;margin-top:28px}
.label{color:#696969;font-weight:400;font-size:38px;line-height:1.5;margin-top:44px;max-width:800px}
</style></head><body>
<div class="card">
  <img class="mark" src="../assets/logo.svg" alt="Hargrove">
  <div class="body">
    <div class="eyebrow">Trusted nationwide</div>
    <div class="stat">$400B+</div>
    <div class="label">in client assets across our RIA partners.</div>
  </div>
</div>
</body></html>
