<!-- @dsCard group="Social" viewport="1200x1200" name="04 · Event announcement" subtitle="Navy cover — event eyebrow, hook headline, speaker headshot" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#16335D;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.mark{width:210px;height:auto;display:block}
.body{margin-top:auto}
.eyebrow{color:#C9D6EA;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
h1{color:#fff;font-weight:800;font-size:88px;line-height:1.08;text-transform:uppercase;margin:28px 0 0;max-width:940px}
.meta{color:#C9D6EA;font-weight:400;font-size:36px;line-height:1.5;margin-top:44px}
.speaker{display:flex;align-items:center;gap:28px;margin-top:56px;padding-top:44px;border-top:1px solid #40587A}
.speaker img{width:132px;height:132px;border-radius:999px;object-fit:cover;display:block}
.speaker .n{color:#fff;font-weight:700;font-size:34px}
.speaker .r{color:#C9D6EA;font-weight:400;font-size:28px;margin-top:6px}
</style></head><body>
<div class="card">
  <img class="mark" src="../assets/logo-white.svg" alt="Hargrove">
  <div class="body">
    <div class="eyebrow">CE Webinar</div>
    <h1>Advanced estate planning</h1>
    <div class="meta">Thursday, September 18 · 1:00 PM ET · One CE credit</div>
    <div class="speaker">
      <img src="../assets/people/Mo-Zoubi.jpg" alt="Mo Zoubi">
      <div><div class="n">Mo Zoubi</div><div class="r">Hargrove Firm</div></div>
    </div>
  </div>
</div>
</body></html>
