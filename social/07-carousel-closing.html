<!-- @dsCard group="Social" viewport="1200x1200" name="07 · Carousel closing" subtitle="Navy — CTA + URL instead of an arrow, wordmark bottom-left" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#16335D;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.body{margin-top:0}
.eyebrow{color:#C9D6EA;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
h1{color:#fff;font-weight:800;font-size:92px;line-height:1.08;text-transform:uppercase;margin:28px 0 0;max-width:940px}
.support{color:#C9D6EA;font-weight:400;font-size:36px;line-height:1.5;margin-top:44px;max-width:800px}
.cta{margin-top:56px;display:inline-flex;align-items:center;background:#fff;color:#16335D;font-weight:600;font-size:34px;border-radius:999px;padding:28px 56px;align-self:flex-start}
.url{color:#9FC2F0;font-weight:500;font-size:32px;margin-top:36px}
.mark{width:210px;height:auto;display:block;position:absolute;left:96px;bottom:96px}
</style></head><body>
<div class="card">
  <div class="body">
    <div class="eyebrow">Get started</div>
    <h1>Fixed fee. No surprises.</h1>
    <div class="support">Schedule a consultation with our legal team.</div>
    <div class="cta">Schedule a Consultation</div>
    <div class="url">hargrovefirm.com · (833) HARGROVE</div>
  </div>
  <img class="mark" src="../assets/logo-white.svg" alt="Hargrove">
</div>
</body></html>
