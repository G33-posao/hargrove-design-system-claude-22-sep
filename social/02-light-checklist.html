<!-- @dsCard group="Social" viewport="1200x1200" name="02 · Light content + checkmarks" subtitle="Content register — sentence case SemiBold navy, navy checkmark squares" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#fff;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.mark{width:210px;height:auto;display:block}
.body{margin-top:auto}
.eyebrow{color:#999;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
h1{color:#16335D;font-weight:600;font-size:60px;line-height:1.12;margin:28px 0 0;max-width:940px}
ul{list-style:none;padding:0;margin:44px 0 0;display:flex;flex-direction:column;gap:26px}
li{display:flex;gap:22px;align-items:flex-start;color:#696969;font-size:36px;line-height:1.5;max-width:880px}
li .box{flex:none;width:64px;height:64px;border-radius:14px;background:#16335D;display:flex;align-items:center;justify-content:center;margin-top:4px}
.arrow{position:absolute;right:96px;bottom:96px}
</style></head><body>
<div class="card">
  <img class="mark" src="../assets/logo.svg" alt="Hargrove">
  <div class="body">
    <div class="eyebrow">Every package includes</div>
    <h1>One price. No surprises.</h1>
    <ul>
      <li><span class="box"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>Spouse's plan at no additional cost</span></li>
      <li><span class="box"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>At-home notarization</span></li>
      <li><span class="box"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span>Execution support &amp; funding guidance</span></li>
    </ul>
  </div>
  <svg class="arrow" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#16335D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
</div>
</body></html>
