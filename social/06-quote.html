<!-- @dsCard group="Social" viewport="1200x1200" name="06 · Quote / testimonial" subtitle="Panel #F8F8F8 — verbatim quote, round headshot, attribution" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#F8F8F8;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.mark{width:210px;height:auto;display:block}
.body{margin-top:auto}
.eyebrow{color:#999;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
.quote{color:#16335D;font-weight:600;font-size:56px;line-height:1.22;margin-top:28px;max-width:960px}
.who{margin-top:56px;padding-top:44px;border-top:1px solid #E3E7EE}
.who .n{color:#16335D;font-weight:700;font-size:32px}
.who .r{color:#696969;font-weight:400;font-size:27px;margin-top:6px;line-height:1.35}
</style></head><body>
<div class="card">
  <img class="mark" src="../assets/logo.svg" alt="Hargrove">
  <div class="body">
    <div class="eyebrow">In their words</div>
    <div class="quote">&ldquo;What I value about Hargrove is the fixed-cost structure, the in-house experience, and the transparency of the process.&rdquo;</div>
    <div class="who">
      <div class="n">Bob Glass</div><div class="r">Director &amp; Senior Wealth Advisor<br>Mariner Wealth Advisors</div>
    </div>
  </div>
</div>
</body></html>
