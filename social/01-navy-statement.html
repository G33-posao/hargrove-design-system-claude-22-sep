<!-- @dsCard group="Social" viewport="1200x1200" name="01 · Navy statement" subtitle="Hook register — ALL CAPS ExtraBold white on navy, wordmark top-left" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.card{width:1200px;height:1200px;background:#16335D;box-sizing:border-box;padding:96px;font-family:var(--font-sans);display:flex;flex-direction:column;position:relative}
.mark{width:210px;height:auto;display:block}
.body{margin-top:auto}
.eyebrow{color:#C9D6EA;font-weight:600;font-size:30px;text-transform:uppercase;letter-spacing:.18em}
h1{color:#fff;font-weight:800;font-size:92px;line-height:1.08;text-transform:uppercase;margin:28px 0 0}
.support{color:#C9D6EA;font-weight:400;font-size:36px;line-height:1.5;margin-top:44px;max-width:800px}
.arrow{position:absolute;right:96px;bottom:96px}
</style></head><body>
<div class="card">
  <img class="mark" src="../assets/logo-white.svg" alt="Hargrove">
  <div class="body">
    <div class="eyebrow">Attorney-led</div>
    <h1>A licensed attorney stands behind every plan</h1>
    <div class="support">Not a vendor, not a bot.</div>
  </div>
  <svg class="arrow" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
</div>
</body></html>
