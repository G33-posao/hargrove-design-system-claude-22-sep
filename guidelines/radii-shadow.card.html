<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-sans);padding:26px;display:flex;gap:22px;align-items:center;background:#fff}
.box{background:#F8F8F8;border:1px solid #E3E7EE;box-shadow:0 8px 24px rgba(22,51,93,.06);width:120px;height:88px;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;color:#16335D;font-size:12px;font-weight:600}
.chip{width:56px;height:56px;background:#16335D;border-radius:12px;box-shadow:0 2px 6px rgba(22,51,93,.18)}
.pill{background:#16335D;color:#fff;border-radius:999px;padding:12px 22px;font-size:14px;font-weight:600}
.lbl{font-size:11px;color:#999;text-align:center;margin-top:6px}
.stack{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="stack"><div class="box" style="border-radius:14px">Card · 14px</div></div>
<div class="stack"><div class="chip"></div><div class="lbl">Chip · 12px</div></div>
<div class="stack"><div class="pill">Button</div><div class="lbl">Pill · 999px</div></div>
</body></html>
