<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-sans);padding:20px;display:flex;gap:14px}
.sw{flex:1;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;box-sizing:border-box;border:1px solid #E3E7EE}
.name{font-weight:600;font-size:13px}.hex{font-size:12px;opacity:.7;margin-top:2px}
</style></head><body>
<div class="sw" style="background:#000;color:#fff"><span class="name">Black</span><span class="hex">#000000</span></div>
<div class="sw" style="background:#696969;color:#fff"><span class="name">Grey · body</span><span class="hex">#696969</span></div>
<div class="sw" style="background:#999;color:#fff"><span class="name">Grey · muted</span><span class="hex">#999999</span></div>
<div class="sw" style="background:#F8F8F8;color:#16335D"><span class="name">Panel</span><span class="hex">#F8F8F8</span></div>
<div class="sw" style="background:#fff;color:#16335D"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
</body></html>
