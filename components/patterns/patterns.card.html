</head><body><div id="root"></div>
<script type="text/babel">

const I = ({n,s=22})=><i data-lucide={n} style={{width:s,height:s}}></i>;
function Demo(){
  React.useEffect(()=>{const t=setTimeout(()=>window.lucide&&window.lucide.createIcons(),60);return ()=>clearTimeout(t);},[]);
  return <div>
    <div className="row">
      <StatCallout value="$400B+" label="client assets across RIA partners" size={64}/>

      <StatCallout value="Top 5" label="Barron's, 9 consecutive years" size={64}/>

    <div className="row">

      <CommitmentCard style={{flex:1}} icon={<I n="eye"/>} title="Visibility">Track every client's progress in real time.</CommitmentCard>
    </div>
    <div className="row" style={{alignItems:'center'}}>
      <StepBadge n={1}/><StepBadge n={2}/><StepBadge n={3}/>
      <StepBadge n={1} variant="tab"/><StepBadge n={4} variant="tab"/>
    </div>
    <div className="row" style={{flexDirection:'column',gap:10}}>
      <CheckItem align="top">The client understands why estate planning matters to their financial plan.</CheckItem>
      <CheckItem>The client is comfortable engaging virtually.</CheckItem>
    </div>
    <div className="grid3">
      <PricingCard name="Essential" price="$3,000" description="Best for simple will- or trust-based plans." features={["Living Trust","Durable Power of Attorney","HIPAA Authorization"]} cta="Get started"/>

      <PricingCard name="Private Wealth Counsel" price="$6,000" priceNote="initial fee" description="For significant wealth requiring sophisticated planning." featuresLabel="Everything in Advanced, Plus" features={["One irrevocable trust","SLATs, ILITs, IDGTs"]} cta="Talk to us"/>
    </div>
    <div className="row" style={{marginTop:26}}>
      <Testimonial style={{flex:1}} quote="What I value about Hargrove is the fixed-cost structure, the in-house experience, and the transparency of the process." name="Bob Glass" title="Director & Senior Wealth Advisor" firm="Mariner Wealth Advisors"/>
      <Testimonial style={{flex:1}} quote="Hargrove helps remove those barriers so clients can take the next step." name="Amanda Long" title="Senior Wealth Advisor" firm="Mariner Wealth Advisors"/>

ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),150);
