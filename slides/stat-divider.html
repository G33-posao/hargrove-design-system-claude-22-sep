<!-- @dsCard group="Slides" viewport="1280x720" name="Stat divider" subtitle="Navy section divider — big stat callouts on tone-on-tone tiles" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.slide{width:1280px;height:720px;background:#16335D;font-family:var(--font-sans);box-sizing:border-box;padding:88px 100px;position:relative;display:flex;flex-direction:column;justify-content:center}
.eyebrow{color:#C9D6EA;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
h2{font-family:var(--font-display);color:#fff;font-weight:700;font-size:52px;line-height:1.08;margin:16px 0 0;max-width:760px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:64px}
.stat{background:#1B3A68;border:1px solid #40587A;border-radius:14px;padding:34px 30px}
.stat .n{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:1;color:#fff}
.stat .l{color:#C9D6EA;font-size:15px;margin-top:12px;line-height:1.4}
.mark{position:absolute;bottom:56px;right:100px}
.mark img{width:150px;height:auto;opacity:.9}
</style></head><body>
<div class="slide">
  <div class="eyebrow">Enterprise-proven</div>
  <h2>Scaling estate planning nationwide with Hargrove</h2>
  <div class="row">
    <div class="stat"><div class="n">800+</div><div class="l">advisors across 44 states and Puerto Rico</div></div>
    <div class="stat"><div class="n">$98.6B</div><div class="l">in assets under management</div></div>
    <div class="stat"><div class="n">Top 5</div><div class="l">Barron's RIA ranking, nine consecutive years</div></div>
  </div>
  <div class="mark"><img src="../assets/logo-white.svg" alt="Hargrove"></div>
</div>
</body></html>
