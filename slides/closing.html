<!-- @dsCard group="Slides" viewport="1280x720" name="Closing" subtitle="Navy closing — Questions? + wordmark signature" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.slide{width:1280px;height:720px;background:#16335D;font-family:var(--font-sans);box-sizing:border-box;padding:100px;position:relative;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.slide::after{content:"";position:absolute;left:-140px;bottom:-120px;width:640px;height:900px;background:repeating-linear-gradient(120deg,rgba(255,255,255,.03) 0 2px,transparent 2px 30px);transform:rotate(6deg)}
h1{font-family:var(--font-display);color:#fff;font-weight:800;font-size:96px;margin:0;position:relative;z-index:1}
p{color:#C9D6EA;font-size:22px;line-height:1.5;margin:24px 0 0;position:relative;z-index:1;max-width:640px}
.contact{color:#9FC2F0;font-size:17px;margin-top:40px;position:relative;z-index:1}
.mark{position:absolute;top:64px;left:100px;z-index:1}
.mark img{width:170px;height:auto}
</style></head><body>
<div class="slide">
  <div class="mark"><img src="../assets/logo-white.svg" alt="Hargrove"></div>
  <h1>Questions?</h1>
  <p>Visit us at our booth for a live demo of the advisor portal.</p>
  <div class="contact">hargrovefirm.com&nbsp;&nbsp;·&nbsp;&nbsp;support@hargrovefirm.com&nbsp;&nbsp;·&nbsp;&nbsp;(833) HARGROVE</div>
</div>
</body></html>
