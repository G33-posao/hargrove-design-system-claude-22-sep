<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}
.slide{width:1280px;height:720px;background:#16335D;position:relative;font-family:var(--font-sans);overflow:hidden;box-sizing:border-box;padding:96px 100px;display:flex;flex-direction:column;justify-content:flex-end}
.slide::after{content:"";position:absolute;right:-120px;top:-80px;width:620px;height:900px;background:repeating-linear-gradient(120deg,rgba(255,255,255,.035) 0 2px,transparent 2px 30px);transform:rotate(6deg)}
.eyebrow{color:#C9D6EA;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;position:relative;z-index:1}
h1{font-family:var(--font-display);color:#fff;font-weight:800;font-size:64px;line-height:1.04;text-transform:uppercase;margin:22px 0 0;max-width:820px;position:relative;z-index:1}
.meta{color:#9FB3D1;font-size:19px;margin-top:36px;position:relative;z-index:1}
.mark{position:absolute;top:64px;left:100px;z-index:1}
.mark img{width:170px;height:auto}
</style></head><body>
<div class="slide">
  <div class="mark"><img src="../assets/logo-white.svg" alt="Hargrove"></div>
  <div class="eyebrow">Practice Management Forum</div>
  <h1>Attorney-led estate planning with Hargrove</h1>
  <div class="meta">Mariner Wealth Advisors&nbsp;&nbsp;|&nbsp;&nbsp;September 2026</div>
</div>
</body></html>
